name: Release

# Push a tag like v1.0.0 to build EmbedItems.exe and attach it to a new GitHub Release.
# Pushes to branches / pull requests only check that it builds.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "EmbedItems.csproj"

jobs:
  build:
    runs-on: windows-latest   # win-x64 single-file exe
    permissions:
      contents: write   # needed for the GitHub Release step
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # v1.2.3 -> 1.2.3; untagged builds get 0.0.0
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output ./publish

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbedItems
          path: ./publish/EmbedItems.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./publish/EmbedItems.exe
