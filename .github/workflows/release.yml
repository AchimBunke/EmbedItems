name: Release

# Push a tag like v2.0.0 to build both exes and attach them to a new GitHub Release:
#   EmbedItems.exe     the app (UI)
#   EmbedItemsCli.exe  the command line version (same features)
# Pushes to branches / pull requests only build and run the tests.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    runs-on: windows-latest   # win-x64 single-file exes, WinForms
    permissions:
      contents: write   # needed for the GitHub Release step
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # v1.2.3 -> 1.2.3; untagged builds get 0.0.0
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test Tests/EmbedItems.Tests.csproj --configuration Release

      - name: Publish app
        run: >
          dotnet publish App/EmbedItems.App.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output ./publish

      - name: Publish command line
        run: >
          dotnet publish Cli/EmbedItems.Cli.csproj
          --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output ./publish

      - name: Upload exes as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbedItems
          path: |
            ./publish/EmbedItems.exe
            ./publish/EmbedItemsCli.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./publish/EmbedItems.exe
            ./publish/EmbedItemsCli.exe
